<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <title>Lightspill</title>
  <defs>
    <!-- Cool light on the left, warm light on the right -->
    <linearGradient id="leftLight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8b93ff"/>
      <stop offset="1" stop-color="#c46bff"/>
    </linearGradient>
    <linearGradient id="rightLight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffbe5c"/>
      <stop offset="1" stop-color="#ff6b8b"/>
    </linearGradient>
    <!-- The picture spreading into the lights -->
    <linearGradient id="picture" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8b93ff"/>
      <stop offset="0.5" stop-color="#c46bff"/>
      <stop offset="1" stop-color="#ff8f6b"/>
    </linearGradient>
    <filter id="glow" x="-150%" y="-30%" width="400%" height="160%">
      <feGaussianBlur stdDeviation="3.2"/>
    </filter>
  </defs>

  <rect x="1" y="1" width="62" height="62" rx="14" fill="#161920" stroke="#2a2f3a" stroke-width="2"/>

  <!-- Light glow -->
  <rect x="8" y="17" width="5" height="26" rx="2.5" fill="url(#leftLight)" filter="url(#glow)" opacity="0.9"/>
  <rect x="51" y="17" width="5" height="26" rx="2.5" fill="url(#rightLight)" filter="url(#glow)" opacity="0.9"/>

  <!-- Light bars -->
  <rect x="9" y="18" width="3.5" height="24" rx="1.75" fill="url(#leftLight)"/>
  <rect x="51.5" y="18" width="3.5" height="24" rx="1.75" fill="url(#rightLight)"/>

  <!-- Monitor -->
  <rect x="17.5" y="18.5" width="29" height="21" rx="3" fill="#0e1014" stroke="#e7e9ee" stroke-width="2.5"/>
  <rect x="21.5" y="31" width="21" height="4.5" rx="1.5" fill="url(#picture)"/>
  <path d="M28 46h8" stroke="#e7e9ee" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M32 40.5v5" stroke="#e7e9ee" stroke-width="2.5"/>
</svg>
